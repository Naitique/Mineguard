; ============================================================================
; Mineguard - AI-Enabled Smart Mine Subsidence Monitoring (student prototype)
; Firmware build configuration for the ESP32 sensor node.
;
; PHASE 1 scope: ESP32-WROOM-32 + GY-521 MPU6050 over I2C -> Serial Monitor.
; VL53L1X / LoRa / Wi-Fi / Raspberry Pi / JSON are added in later phases.
; ============================================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev            ; generic ESP32-WROOM-32 dev board
framework = arduino

; Serial Monitor baud. Keep in sync with SERIAL_BAUD in src/config.h.
monitor_speed = 115200

; --- Libraries -------------------------------------------------------------
; Adafruit MPU6050: mature, readable driver for the MPU6050. Chosen so the
;   firmware stays easy for students to follow. We compute roll/pitch
;   ourselves (see lib/MPU6050Sensor) instead of using the on-chip DMP.
; It transitively pulls in:
;   - Adafruit Unified Sensor (sensors_event_t data model)
;   - Adafruit BusIO (I2C/SPI abstraction)
;
; Pololu VL53L1X: minimal, dependency-free driver for the VL53L1X ToF sensor.
;   Chosen for reliability and a simple blocking read() API. See
;   lib/VL53L1XSensor for our wrapper.
;
; sandeepmistry/LoRa: the de-facto standard SX127x (SX1276/77/78/79) driver.
;   Simple packet API, works with the Ra-02 (SX1278). See lib/LoRaTransport.
;
; Versions pinned to avoid surprise API changes.
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    pololu/VL53L1X @ ^1.3.1
    sandeepmistry/LoRa @ ^0.8.0
