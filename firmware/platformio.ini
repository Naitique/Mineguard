; ============================================================================
; Mineguard - AI-Enabled Smart Mine Subsidence Monitoring (student prototype)
; Firmware build configuration for the ESP32 sensor node.
;
; PHASE 1 scope: ESP32-WROOM-32 + GY-521 MPU6050 over I2C -> Serial Monitor.
; LoRa / Wi-Fi / Raspberry Pi / JSON are added in later phases. (The VL53L1X /
; ToF sensor was removed from the project -- no longer used.)
; ============================================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev            ; generic ESP32-WROOM-32 dev board
framework = arduino

; Serial Monitor baud. Keep in sync with SERIAL_BAUD in src/config.h.
monitor_speed = 115200

; --- Libraries -------------------------------------------------------------
; MPU6050Sensor (lib/, ours) talks to the accel/gyro chip via raw I2C
;   registers -- NOT the Adafruit_MPU6050 library. Reason: Adafruit's begin()
;   hard-rejects any chip whose WHO_AM_I isn't exactly 0x68 (genuine
;   MPU6050), and our GY-521 breakout turned out to carry an MPU6500 die
;   (WHO_AM_I 0x70) -- a common clone substitution, still register-compatible
;   for plain accel/gyro reads. Going direct removes an incompatible
;   dependency; see lib/MPU6050Sensor for the register-level driver.
;
; sandeepmistry/LoRa: the de-facto standard SX127x (SX1276/77/78/79) driver.
;   Simple packet API, works with the Ra-02 (SX1278). See lib/LoRaTransport.
;
; mikalhart/TinyGPSPlus: the standard, minimal NMEA sentence parser for
;   Arduino/ESP32. No hardware handshake -- we feed it raw bytes from a
;   HardwareSerial and it exposes parsed fix/lat/lon/etc. See lib/GPSModule.
;
; paulstoffregen/OneWire + milesburton/DallasTemperature: the standard pairing
;   for the DS18B20 -- OneWire implements the 1-Wire bus protocol, Dallas
;   Temperature adds the sensor-specific commands on top. See lib/DS18B20Sensor.
;
; Versions pinned to avoid surprise API changes.
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
